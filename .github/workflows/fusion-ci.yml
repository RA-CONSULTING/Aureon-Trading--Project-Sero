name: Aureon Fusion CI

# Runs on every pull request and on pushes to main. No secrets, no network
# services, no live trading. The commands match the ones recorded in
# PRODUCTION_READINESS.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: aureon-fusion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fusion:
    name: fusion tests
    runs-on: ubuntu-latest
    env:
      AUREON_LIVE_TRADING: "0"
      AUREON_FUSION_ARM_LIVE: ""
      BINANCE_TESTNET: "true"
      PAPER_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Compile the fusion package
        run: python -m compileall -q aureon_fusion organism
      - name: Fusion, market, and field tests
        run: python -m pytest tests/test_fusion_join.py tests/test_public_field.py tests/test_fusion_http.py organism/test_public_market.py -q --tb=short
      - name: Organism layer and plant atlas tests
        working-directory: aureon-os-upstream
        env:
          PYTHONPATH: .
          AUREON_LLM_OFFLINE: "1"
        run: python -m pytest tests/test_repository_layers.py tests/test_sandbox_self_repair.py tests/bio/test_plant_atlas_models.py tests/bio/test_plant_atlas_harmonics.py tests/bio/test_plant_atlas_sharding.py tests/bio/test_plant_atlas_source_snapshot.py tests/bio/test_plant_atlas_worker.py tests/bio/test_plant_atlas_gpu_backend.py tests/bio/test_plant_atlas_schemas.py -q --tb=line
